# Codemagic CI/CD — DugoutIQ iOS (Capacitor + Vite, SPM, no CocoaPods)
#
# One-time setup before the first run (see chat for step-by-step):
#  1. App Store Connect -> Users and Access -> Integrations -> App Store Connect API
#       -> generate an API key with "App Manager" access. Note Issuer ID + Key ID, download the .p8.
#  2. Codemagic -> Teams/Personal -> Settings -> Integrations -> App Store Connect
#       -> add that key. NAME IT EXACTLY:  DugoutIQ ASC
#       (must match `integrations.app_store_connect` below).
#  3. Connect this GitHub repo in Codemagic, pick the `ios-appstore` workflow, Start build.
#
# Signing is automatic: Codemagic uses the API key to fetch/create the
# distribution certificate + provisioning profile for the bundle id below.

workflows:
  ios-appstore:
    name: DugoutIQ iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic         # <-- must match the API key name in Codemagic's Apple Developer Portal integration
    environment:
      groups:
        - appstore_credentials             # Codemagic env group holding CERTIFICATE_PRIVATE_KEY
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.studiopabst.dugoutiq"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web assets (Vite)
        script: npm run build
      - name: Capacitor sync iOS (copies web build, resolves SPM packages)
        script: npx cap sync ios
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or CREATE signing files (first build has no cert/profile yet)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Set build number to the Codemagic build counter
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          # Keeps every upload's CFBundleVersion unique and increasing.
          agvtool new-version -all "$BUILD_NUMBER" || true
      - name: Build signed .ipa
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      # Uploads the build to App Store Connect. It then appears in the
      # "Build" picker on the 1.0 version page, where you attach the IAP
      # and click Submit for Review manually (metadata is already staged).
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - jepabst@gmail.com
        notify:
          success: true
          failure: true
