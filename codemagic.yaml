# Codemagic CI/CD — DugoutIQ iOS (Capacitor + Vite, SPM, no CocoaPods)
#
# One-time setup before the first run (see chat for step-by-step):
#  1. App Store Connect -> Users and Access -> Integrations -> App Store Connect API
#       -> generate an API key with "App Manager" access. Note Issuer ID + Key ID, download the .p8.
#  2. Codemagic -> Teams/Personal -> Settings -> Integrations -> App Store Connect
#       -> add that key. NAME IT EXACTLY:  DugoutIQ ASC
#       (must match `integrations.app_store_connect` below).
#  3. Connect this GitHub repo in Codemagic, pick the `ios-appstore` workflow, Start build.
#
# Signing is automatic: Codemagic uses the API key to fetch/create the
# distribution certificate + provisioning profile for the bundle id below.

workflows:
  ios-appstore:
    name: DugoutIQ iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        # Group must contain these secure variables (set in Codemagic UI):
        #   CERTIFICATE_PRIVATE_KEY            - RSA key for the distribution certificate
        #   APP_STORE_CONNECT_ISSUER_ID        - Issuer ID from ASC -> Integrations
        #   APP_STORE_CONNECT_KEY_IDENTIFIER   - API key ID (ZR9DM9FL3M)
        #   APP_STORE_CONNECT_PRIVATE_KEY      - contents of AuthKey_ZR9DM9FL3M.p8
        - appstore_credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.studiopabst.dugoutiq"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Patch apple-sign-in SPM manifest for Capacitor 8
        # Plugin 7.1.0 is JS-compatible with Cap 8 (peer >=7.0.0) but its
        # Package.swift pins capacitor-swift-pm to 7.x, which can't co-resolve
        # with the app's exact 8.3.0. No Cap-8 plugin release exists yet —
        # remove this step when one does.
        script: |
          sed -i '' 's|from: "7.0.0"|from: "8.0.0"|' node_modules/@capacitor-community/apple-sign-in/Package.swift
          grep 'capacitor-swift-pm' node_modules/@capacitor-community/apple-sign-in/Package.swift
      - name: Build web assets (Vite)
        script: npm run build
      - name: Capacitor sync iOS (copies web build, resolves SPM packages)
        script: npx cap sync ios
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or CREATE signing files (first build has no cert/profile yet)
        script: |
          # Confirm the credentials are actually present (prints yes/NO, never the secret).
          echo "BUNDLE_ID=$BUNDLE_ID"
          echo "ISSUER_ID set:      $([ -n "$APP_STORE_CONNECT_ISSUER_ID" ] && echo yes || echo NO)"
          echo "KEY_IDENTIFIER set: $([ -n "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] && echo yes || echo NO)"
          echo "ASC_PRIVATE_KEY set:$([ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ] && echo yes || echo NO)"
          echo "CERTIFICATE_KEY set:$([ -n "$CERTIFICATE_PRIVATE_KEY" ] && echo yes || echo NO)"
          echo "--- existing distribution certificates on the account ---"
          app-store-connect certificates list --type IOS_DISTRIBUTION || true
          echo "--- fetching/creating signing files ---"
          # Pass API auth explicitly (don't rely on env auto-detection) and be verbose
          # so any Apple-side error (e.g. cert limit reached) is printed in full.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key=@env:APP_STORE_CONNECT_PRIVATE_KEY \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create \
            --verbose
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Set build number to the Codemagic build counter
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          # Keeps every upload's CFBundleVersion unique and increasing.
          agvtool new-version -all "$BUILD_NUMBER" || true
      - name: Resolve Swift packages (raw output for diagnosis)
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          echo "=== Package.swift as seen on the build machine ==="
          cat CapApp-SPM/Package.swift
          echo "=== Resolving packages ==="
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
      - name: Build signed .ipa
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      # Uploads the build to App Store Connect. It then appears in the
      # "Build" picker on the 1.0 version page, where you attach the IAP
      # and click Submit for Review manually (metadata is already staged).
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - jepabst@gmail.com
        notify:
          success: true
          failure: true
